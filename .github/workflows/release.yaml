name: release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Deliberately no `registry-url`. Passing it makes setup-node write an
      # .npmrc containing `_authToken=${NODE_AUTH_TOKEN}`, and with no token
      # secret set that expands to setup-node's literal placeholder
      # (XXXXX-XXXXX-XXXXX-XXXXX). npm finds a token, authenticates with the
      # bogus value instead of exchanging its OIDC token, and the registry
      # answers the PUT with `404 ... or you do not have permission` — after
      # provenance has already signed successfully, because sigstore uses the
      # OIDC token directly and does not care about registry auth.
      # The tell is the absence of npm's "No NPM_TOKEN found, but OIDC is
      # available - using npm trusted publishing" line in the publish log.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Trusted publishing (OIDC) requires npm >= 11.5.1, newer than the npm
      # bundled with Node 22 (10.9.x). Without this the publish fails at the
      # very end of a release run, after every check has already passed.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: bun run scripts/verify-release-version.ts

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build package
        run: bun run build

      - name: Check package exports and types
        run: bun run package:check

      - name: Publish to npm
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: npm publish

  build-binaries:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            asset: skillset-linux-x64
          - target: bun-linux-arm64
            asset: skillset-linux-arm64
          - target: bun-darwin-x64
            asset: skillset-darwin-x64
          - target: bun-darwin-arm64
            asset: skillset-darwin-arm64
          - target: bun-windows-x64
            asset: skillset-windows-x64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: bun run scripts/verify-release-version.ts

      # Bun cross-compiles every target from a single Linux runner.
      - name: Compile executable
        run: bun build ./src/bin.ts --compile --minify --target=${{ matrix.target }} --outfile binaries/${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: binaries/${{ matrix.asset }}
          if-no-files-found: error

  github-release:
    needs: [publish-npm, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      - name: Create GitHub release with binaries
        uses: softprops/action-gh-release@v2
        with:
          files: binaries/*
          generate_release_notes: true
