name: release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # setup-node writes the .npmrc (registry wiring) needed for OIDC trusted
      # publishing with provenance — no hand-rolled .npmrc, no NPM_TOKEN.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Node 22 ships npm 10.x; trusted publishing (OIDC) needs npm >= 11.5.1.
      - name: Upgrade npm
        run: npm install -g npm@^11.5.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: bun run scripts/verify-release-version.ts

      - name: Preflight publish checks
        run: bun run preflight:publish

      # Runs the same gate `prepublishOnly` would, but up front, so a failure
      # surfaces before the publish attempt rather than inside it. This also
      # builds `dist/`, which the `--ignore-scripts` publish below relies on.
      - name: Validate
        run: bun run validate

      # `--ignore-scripts` because `validate` already ran the full gate and the
      # build. It also keeps the publish itself short: npm mints its OIDC token
      # before running lifecycle scripts, so letting the whole gate run inside
      # `npm publish` lets that token expire before the PUT — which the registry
      # reports as `404 ... or you do not have permission`, indistinguishable
      # from a misconfigured trusted publisher. It additionally avoids a nested
      # `npm pack` (from attw, via prepublishOnly) inside the publish lifecycle.
      - name: Publish to npm
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: npm publish --ignore-scripts

  build-binaries:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            asset: skillset-linux-x64
          - target: bun-linux-arm64
            asset: skillset-linux-arm64
          - target: bun-darwin-x64
            asset: skillset-darwin-x64
          - target: bun-darwin-arm64
            asset: skillset-darwin-arm64
          - target: bun-windows-x64
            asset: skillset-windows-x64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: bun run scripts/verify-release-version.ts

      # Bun cross-compiles every target from a single Linux runner.
      - name: Compile executable
        run: bun build ./src/bin.ts --compile --minify --target=${{ matrix.target }} --outfile binaries/${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: binaries/${{ matrix.asset }}
          if-no-files-found: error

  github-release:
    needs: [publish-npm, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      - name: Create GitHub release with binaries
        uses: softprops/action-gh-release@v2
        with:
          files: binaries/*
          generate_release_notes: true
