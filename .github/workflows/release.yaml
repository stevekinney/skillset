name: release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 24 (LTS) ships npm 11.17.0. Trusted publishing needs npm >= 11.5.1,
      # and Node 22 ships 10.9.8 — which supports provenance but not OIDC
      # registry auth. That combination fails in two confusing ways: with a
      # token present it publishes anonymously and the registry answers the PUT
      # with `404 ... or you do not have permission`; with no token it fails
      # earlier with `ENEEDAUTH`. Provenance signs successfully either way,
      # because sigstore uses the OIDC token directly and never touches
      # registry auth, which makes both look like a trusted-publisher
      # misconfiguration. npm's own recommended workflow pins Node 24.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: bun run scripts/verify-release-version.ts

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build package
        run: bun run build

      - name: Check package exports and types
        run: bun run package:check

      - name: Publish to npm
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        # The npm version is printed because every failure mode of trusted
        # publishing looks like a permissions problem, and the version is the
        # first thing worth ruling out.
        run: |
          npm --version
          npm publish

  build-binaries:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            asset: skillset-linux-x64
          - target: bun-linux-arm64
            asset: skillset-linux-arm64
          - target: bun-darwin-x64
            asset: skillset-darwin-x64
          - target: bun-darwin-arm64
            asset: skillset-darwin-arm64
          - target: bun-windows-x64
            asset: skillset-windows-x64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: bun run scripts/verify-release-version.ts

      # Bun cross-compiles every target from a single Linux runner.
      - name: Compile executable
        run: bun build ./src/bin.ts --compile --minify --target=${{ matrix.target }} --outfile binaries/${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: binaries/${{ matrix.asset }}
          if-no-files-found: error

  github-release:
    needs: [publish-npm, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      - name: Create GitHub release with binaries
        uses: softprops/action-gh-release@v2
        with:
          files: binaries/*
          generate_release_notes: true
