name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows and macOS file systems are case-insensitive and Windows checks
        # files out differently, so behavior differs by OS, not just by Node.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['22', '24']
    defaults:
      run:
        # The same shell on every OS (Git Bash on Windows), so each step reads alike.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned for reproducibility; bump deliberately (or via Dependabot).
          bun-version: 1.4.0

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate
        run: bun run validate

      # `validate` runs entirely under Bun. These steps exercise the emitted
      # Node bundles under the matrix Node version so the matrix is meaningful.
      - name: Smoke-test Node library build
        run: node --input-type=module -e "import { runCli } from './dist/node/index.js'; if (typeof runCli !== 'function') { throw new Error('Node build smoke test failed'); }"

      - name: Smoke-test Node CLI build
        run: node ./dist/node/bin.js --help

      # Releases ship standalone binaries for every OS; build and run one natively.
      - name: Smoke-test compiled binary
        run: |
          bun build ./src/bin.ts --compile --outfile smoke/skillset
          ./smoke/skillset --help
